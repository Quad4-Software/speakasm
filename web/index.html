  <meta name="twitter:image:alt" content="speakasm: Offline Text to Speech">

  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0b0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="speakasm">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "speakasm",
    "url": "https://speakasm.quad4.io/",
    "description": "Offline Text to Speech in the browser via Kokoro ONNX. Nothing is uploaded.",
    "image": "https://speakasm.quad4.io/og/og.png",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires a modern browser with WebAssembly and Web Workers.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "creator": {
      "@type": "Organization",
      "name": "Quad4 Software",
      "url": "https://github.com/Quad4-Software"
    },
    "license": "https://github.com/Quad4-Software/speakasm/blob/master/LICENSE"
  }
  </script>
</head>
<body>
  <div class="chrome-top">
    <button type="button" id="btn-install" class="chrome-link" hidden>Install</button>
    <button type="button" id="btn-ios-tip" class="chrome-link" hidden>Add to Home Screen</button>
    <a class="chrome-link" href="https://github.com/Quad4-Software/speakasm" rel="noopener noreferrer" target="_blank">Source</a>
  </div>
  <div id="ios-tip-panel" class="ios-tip" hidden>
    On iPhone: tap Share, then Add to Home Screen.
  </div>
  <div class="atmosphere" aria-hidden="true"></div>
  <div id="drop-overlay" class="drop-overlay" hidden aria-hidden="true">
    <p>Drop text, EPUB, or DOCX to speak</p>
  </div>
  <main class="stage">
    <header class="brand-block">
      <p class="brand">speakasm</p>
      <h1 class="headline">Offline Text to Speech</h1>
    </header>

    <div class="workspace">
      <section class="panel panel-input" aria-label="Write">
        <div class="hero-visual" aria-hidden="true">
          <canvas id="wave" width="1200" height="280"></canvas>
        </div>

        <div class="controls">
          <div class="control-row">
            <label class="field">
              <span>Voice</span>
              <select id="voice"></select>
            </label>
            <label class="field field-speed">
              <span>Speed <em id="speed-val">1.00x</em></span>
              <input type="range" id="speed" min="0.5" max="1.5" step="0.05" value="1">
            </label>
            <button type="button" id="btn-offline" class="linkish offline-btn">Save offline</button>
          </div>

          <label class="field field-text">
            <span class="field-head">
              <span>Text</span>
              <span id="char-count" class="char-count">0 chars</span>
            </span>
            <textarea id="input" rows="10" placeholder="Paste text here, or open a TXT / Markdown / HTML / EPUB / DOCX file." spellcheck="true"></textarea>
          </label>

          <div class="cta-row">
            <button type="button" id="btn-speak" class="cta record" disabled>Speak</button>
            <button type="button" id="btn-stop" class="cta secondary" disabled>Stop</button>
            <label class="cta secondary file-cta">
              Open a file
              <input type="file" id="file" accept=".txt,.md,.markdown,.html,.htm,.epub,.docx,.rtf,.csv,.log,text/plain,text/markdown,text/html,application/epub+zip,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
            </label>
          </div>

          <div class="status-row">
            <span id="live-pill" class="live-pill" aria-hidden="true">Live</span>
            <span id="spinner" class="spinner" hidden aria-hidden="true"></span>
            <p id="status" class="status" role="status">Getting ready...</p>
          </div>
          <div class="progress-track" hidden>
            <div id="progress" class="progress-bar"></div>
          </div>
          <p id="error" class="error" role="alert" hidden></p>
        </div>
      </section>

      <section class="panel panel-result" aria-label="Speech">
        <div class="result-toolbar">
          <h2>Cleaned text</h2>
          <div class="result-actions">
            <button type="button" id="btn-download" class="linkish" disabled>Download WAV</button>
            <button type="button" id="btn-clear" class="linkish" disabled>Clear</button>
          </div>
        </div>
        <div id="preview" class="transcript" tabindex="0" aria-live="polite"></div>
        <p id="meta" class="meta" hidden></p>
      </section>
    </div>
  </main>
  <footer class="site-foot">
    <a href="https://github.com/Quad4-Software/speakasm/blob/master/LICENSE" rel="noopener noreferrer" target="_blank">0BSD</a>
    <a href="https://github.com/Quad4-Software" rel="noopener noreferrer" target="_blank">Quad4</a>
  </footer>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
