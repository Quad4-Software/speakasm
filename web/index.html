  <meta name="twitter:image:alt" content="speakasm: Offline Text to Speech">

  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0b0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="speakasm">

  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "speakasm",
    "url": "https://speakasm.quad4.io/",
    "description": "Offline Text to Speech in the browser via Kokoro ONNX. Nothing is uploaded.",
    "image": "https://speakasm.quad4.io/og/og.png",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires a modern browser with WebAssembly and Web Workers.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "creator": {
      "@type": "Organization",
      "name": "Quad4 Software",
      "url": "https://github.com/Quad4-Software"
    },
    "license": "https://github.com/Quad4-Software/speakasm/blob/master/LICENSE"
  }
  </script>

<body>
  <div class="chrome-top">
    <a class="chrome-link" href="https://github.com/Quad4-Software/speakasm" rel="noopener noreferrer" target="_blank">Source</a>
  </div>
  <div class="atmosphere" aria-hidden="true"></div>
  <div id="drop-overlay" class="drop-overlay" hidden aria-hidden="true">
    <p>Drop text, EPUB, or DOCX to speak</p>
  </div>
  <main class="stage">
    <header class="brand-block">
      <p class="brand">speakasm</p>
      <h1 class="headline">Offline Text to Speech</h1>
    </header>

    <div class="workspace">
      <section class="panel panel-input" aria-label="Write">
        <div class="controls">
          <div class="control-row">
            <div class="field field-voice">
              <span class="field-head">
                <span>Voice <em id="voice-label">Heart</em></span>
                <label class="speed-inline">
                  Speed <em id="speed-val">1.00x</em>
                  <input type="range" id="speed" class="slider" min="0.5" max="1.5" step="0.05" value="1">
                </label>
              </span>
              <div class="voice-rail">
                <div id="voice-picker" class="voice-picker" role="listbox" aria-label="Voice"></div>
              </div>
              <input type="hidden" id="voice" value="af_heart">
            </div>
          </div>

          <div class="field field-text">
            <div class="field-head">
              <span>Text</span>
              <span class="field-head-tools">
                <span id="char-count" class="char-count">0 chars</span>
                <button type="button" id="btn-clear" class="linkish clear-inline" disabled>Clear</button>
              </span>
            </div>
            <textarea id="input" rows="3" placeholder="Paste text, or open a file." spellcheck="true" enterkeyhint="done" aria-label="Text"></textarea>
          </div>

          <div class="action-stack">
            <div class="cta-row">
              <button type="button" id="btn-speak" class="cta record" disabled>Speak</button>
              <button type="button" id="btn-stop" class="cta secondary" disabled>Stop</button>
              <label class="cta secondary file-cta" aria-label="Open a file">
                <span class="file-cta-label" aria-hidden="true">Open</span>
                <span class="file-cta-label-full" aria-hidden="true">Open a file</span>
                <input type="file" id="file" accept=".txt,.md,.markdown,.html,.htm,.epub,.docx,.rtf,.csv,.log,text/plain,text/markdown,text/html,application/epub+zip,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
              </label>
            </div>
          </div>

          <div class="status-row">
            <span id="spinner" class="spinner" hidden aria-hidden="true"></span>
            <p id="status" class="status" role="status">Getting ready...</p>
          </div>
          <div class="progress-track" hidden>
            <div id="progress" class="progress-bar"></div>
          </div>
          <p id="error" class="error" role="alert" hidden></p>
        </div>
      </section>

      <section class="panel panel-playback" aria-label="Playback" id="playback">
        <div class="hero-visual" aria-hidden="true">
          <canvas id="wave" width="1200" height="160"></canvas>
        </div>
        <div class="playback-bar">
          <button type="button" id="btn-play" class="cta play" disabled aria-label="Play">
            <span class="play-glyph" aria-hidden="true"></span>
            <span class="play-label">Play</span>
          </button>
          <div class="scrub-wrap">
            <input type="range" id="scrub" class="slider" min="0" max="1000" value="0" step="1" disabled aria-label="Seek">
            <div class="time-row">
              <span id="time-cur">0:00</span>
              <span id="time-total">0:00</span>
            </div>
          </div>
          <button type="button" id="btn-download" class="cta secondary download-cta" disabled aria-label="Download WAV">
            <span class="download-short" aria-hidden="true">WAV</span>
            <span class="download-full" aria-hidden="true">Download WAV</span>
          </button>
        </div>
        <p id="meta" class="meta" hidden></p>
      </section>
    </div>
  </main>
  <footer class="site-foot">
    <a href="/build/">Extensions</a>
    <a href="https://github.com/Quad4-Software/speakasm/blob/master/LICENSE" rel="noopener noreferrer" target="_blank">0BSD</a>
    <a href="https://github.com/Quad4-Software" rel="noopener noreferrer" target="_blank">Quad4</a>
    <span id="app-version" class="site-version" hidden></span>
  </footer>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
