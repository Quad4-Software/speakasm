<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>speakasm</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-48.png" alt="" width="28" height="28">
    <div class="titles">
      <strong>speakasm</strong>
      <span class="sub">text to speech</span>
    </div>
  </header>
  <main>
    <label>Voice
      <select id="voice"></select>
    </label>
    <label>Speed <span id="speed-val">1.0</span>
      <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1">
    </label>
    <textarea id="input" rows="7" placeholder="Text to speak"></textarea>
    <div class="row">
      <button id="btn-speak" type="button">Speak</button>
      <button id="btn-stop" type="button" class="secondary">Stop</button>
    </div>
    <div class="row">
      <button id="btn-sel" type="button" class="secondary">Speak selection</button>
      <button id="btn-page" type="button" class="secondary">Speak page</button>
    </div>
    <label>Bridge origin
      <input id="bridge" type="text" spellcheck="false" placeholder="https://speakasm.quad4.io">
    </label>
    <button id="btn-bridge" type="button" class="ghost">Connect bridge tab</button>
    <p id="status" class="status" role="status"></p>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
