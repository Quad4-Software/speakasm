# Pinned actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.1                   3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-go@v7.0.0                   b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
#   goreleaser/goreleaser-action@v7.2.3       f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
#   docker/setup-qemu-action@v4.3.0           1f40c72289eff860ee54a304f1438e3cff362e0a
#   docker/setup-buildx-action@v4.3.0         37fe631027851001ddb9b187196cc803df7f5f0e
#   docker/login-action@v4.6.0                dbcb813823bdd20940b903addbd779551569679f
#   docker/metadata-action@v6.2.0             dc802804100637a589fabce1cb79ff13a1411302
#   docker/build-push-action@v7.3.0           53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
#
# Secure use: least-privilege GITHUB_TOKEN, pin actions to full commit SHAs,
# no pull_request_target, untrusted input via env (not inline shell).
# https://docs.github.com/en/actions/reference/security/secure-use

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Leave empty to use latest tag or VERSION."
        required: false
        default: ""

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: quad4-software/speakasm

jobs:
  goreleaser:
    name: Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            release --clean
            ${{ github.ref_type != 'tag' && '--snapshot --skip=publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA_FULL: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            RAW="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            RAW="$REF_NAME"
          else
            RAW="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.1.0)"
          fi
          VER="${RAW#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${RAW}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA_FULL}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.meta.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.meta.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.meta.outputs.revision }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
